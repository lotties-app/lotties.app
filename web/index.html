<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f5efe4" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1b1814" media="(prefers-color-scheme: dark)" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Baby Routine" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <script src="/theme-init.js"></script>
    <style>
      /* First paint, before the app's own theme loads: dark unless the OS says light. */
      html {
        background: #1b1814;
      }
      @media (prefers-color-scheme: light) {
        html {
          background: #f5efe4;
        }
      }
      /* theme-init.js marks the stored choice (same attributes the app's theme uses later). */
      html[data-light] {
        background: #f5efe4;
      }
      html[data-dark] {
        background: #1b1814;
      }
      html[data-night] {
        background: #0d0906;
      }
    </style>
    <title>Baby Routine</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
