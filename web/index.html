<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f5efe4" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1b1814" media="(prefers-color-scheme: dark)" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Lotties" />
    <!-- Fallbacks first, the SVG last: browsers that read SVG icons (it follows the OS dark scheme) prefer it. -->
    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/favicon.png"
      media="(prefers-color-scheme: light)"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/favicon-dark.png"
      media="(prefers-color-scheme: dark)"
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- theme-init.js (and the theme provider) switch the manifest and apple-touch-icon to the dark set. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <script src="/theme-init.js"></script>
    <style>
      /* First paint, before the app's own theme loads: dark unless the OS says light. */
      html {
        background: #1b1814;
      }
      @media (prefers-color-scheme: light) {
        html {
          background: #f5efe4;
        }
      }
      /* theme-init.js marks the stored choice (same attributes the app's theme uses later). */
      html[data-light] {
        background: #f5efe4;
      }
      html[data-dark] {
        background: #1b1814;
      }
      html[data-night] {
        background: #0d0906;
      }
    </style>
    <title>Lotties: track your baby's day, together</title>
    <meta
      name="description"
      content="Sleep, feeds, diapers and medicines in one calm place. Works offline, shares with your co-parent. Free and open source."
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Lotties" />
    <meta property="og:title" content="Lotties: track your baby's day, together" />
    <meta
      property="og:description"
      content="Sleep, feeds, diapers and medicines in one calm place. Works offline, shares with your co-parent."
    />
    <meta property="og:image" content="/social-preview.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Lotties: track your baby's day, together" />
    <meta
      name="twitter:description"
      content="Sleep, feeds, diapers and medicines in one calm place. Works offline, shares with your co-parent."
    />
    <meta name="twitter:image" content="/social-preview.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
