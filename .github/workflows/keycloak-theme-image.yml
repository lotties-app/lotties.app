name: Keycloak theme image

# Publishes the theme as an OCI "carrier" image (init container route) and, on tags, the tarball + sha256 as
# release assets (no-registry route). See keycloak-theme/deploy and docs/DEPLOY.md.
#   git tag keycloak-theme-v0.1.0 && git push origin keycloak-theme-v0.1.0
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Image version tag (default: version in keycloak-theme/package.json)'
        required: false
  push:
    tags:
      - 'keycloak-theme-v*'

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write   # release assets on tags
      packages: write   # ghcr.io
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: keycloak-theme/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - uses: stCarolas/setup-maven@v5
        with:
          maven-version: 3.9.9
      - run: npm ci
        working-directory: keycloak-theme
      - run: npm test
        working-directory: keycloak-theme
      - run: npm run build-keycloak-theme
        working-directory: keycloak-theme
      - name: Package the theme directory
        run: SKIP_BUILD=1 bash keycloak-theme/deploy/package-theme.sh
      - name: Resolve version
        id: v
        env:
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          if [ "$REF_TYPE" = tag ]; then v="${REF_NAME#keycloak-theme-v}"
          elif [ -n "$INPUT_VERSION" ]; then v="$INPUT_VERSION"
          else v="$(jq -r .version keycloak-theme/package.json)"; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - name: Build and push ghcr.io/<owner>/baby-routine-keycloak-theme
        uses: docker/build-push-action@v6
        with:
          context: keycloak-theme/deploy
          file: keycloak-theme/deploy/Containerfile.image
          push: true
          build-args: VERSION=${{ steps.v.outputs.version }}
          tags: ghcr.io/${{ github.repository_owner }}/baby-routine-keycloak-theme:${{ steps.v.outputs.version }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
      - name: Attach tarball and checksum to the release (tags only)
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          cd keycloak-theme/deploy/out
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "$TAG" --notes "Baby Routine Keycloak login theme (directory mode)."
          gh release upload "$TAG" baby-routine-theme.tar.gz baby-routine-theme.tar.gz.sha256 --clobber
