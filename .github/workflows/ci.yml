name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege for GITHUB_TOKEN; no job needs more than read access.
permissions:
  contents: read

# Cancel superseded runs on the same pull request; runs on main always finish.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Runner: the repository variable CI_RUNNER (Settings > Secrets and variables > Actions > Variables) names the label of a
  # self-hosted runner; unset, every job runs on GitHub's ubuntu-latest.
  # Decides which suites a change needs. Pushes to main always run everything. The two sides share files:
  # the API tests read the vectors and registry under code/web/src, the web tests read code/api/data.
  changes:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    outputs:
      api: ${{ steps.diff.outputs.api }}
      web: ${{ steps.diff.outputs.web }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then
            echo "api=true" >> "$GITHUB_OUTPUT"; echo "web=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          files=$(git diff --name-only "$BASE" "$GITHUB_SHA")
          echo "$files"
          api='^(code/api/|\.github/workflows/ci\.yml$|code/web/src/.*Vectors\.json$|code/web/src/legal/consentVersions\.json$|code/web/src/events/iconRegistry\.ts$)'
          web='^(code/web/|code/api/data/|\.github/workflows/ci\.yml$)'
          echo "$files" | grep -qE "$api" && echo "api=true" >> "$GITHUB_OUTPUT" || echo "api=false" >> "$GITHUB_OUTPUT"
          echo "$files" | grep -qE "$web" && echo "web=true" >> "$GITHUB_OUTPUT" || echo "web=false" >> "$GITHUB_OUTPUT"

  # The API suite boots a real host per test class and is CPU bound: jobs split by namespace, run side by side
  # (the last one is "everything else", so a new namespace is never left out) and also hold the Domain and Infrastructure tests.
  api:
    name: api (${{ matrix.shard }})
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: authorization
            target: code/api/tests/Lotties.Api.Tests
            filter: FullyQualifiedName~Lotties.Api.Tests.Authorization.
          - shard: assistants-board
            target: code/api/tests/Lotties.Api.Tests
            filter: FullyQualifiedName~Lotties.Api.Tests.Assistants.|FullyQualifiedName~Lotties.Api.Tests.Board.
          - shard: endpoints
            target: code/api/tests/Lotties.Api.Tests
            filter: FullyQualifiedName~Lotties.Api.Tests.Endpoints.
          - shard: imports-backups
            target: code/api/tests/Lotties.Api.Tests
            filter: FullyQualifiedName~Lotties.Api.Tests.Imports.|FullyQualifiedName~Lotties.Api.Tests.Backups.
          - shard: data
            target: code/api/tests/Lotties.Api.Tests
            filter: FullyQualifiedName~Lotties.Api.Tests.Notifications.|FullyQualifiedName~Lotties.Api.Tests.Persistence.|FullyQualifiedName~Lotties.Api.Tests.Consents.|FullyQualifiedName~Lotties.Api.Tests.Catalog.
          - shard: rest
            target: code/api/Lotties.sln
            filter: (FullyQualifiedName!~Lotties.Api.Tests.Authorization.)&(FullyQualifiedName!~Lotties.Api.Tests.Assistants.)&(FullyQualifiedName!~Lotties.Api.Tests.Board.)&(FullyQualifiedName!~Lotties.Api.Tests.Endpoints.)&(FullyQualifiedName!~Lotties.Api.Tests.Backups.)&(FullyQualifiedName!~Lotties.Api.Tests.Imports.)&(FullyQualifiedName!~Lotties.Api.Tests.Notifications.)&(FullyQualifiedName!~Lotties.Api.Tests.Persistence.)&(FullyQualifiedName!~Lotties.Api.Tests.Consents.)&(FullyQualifiedName!~Lotties.Api.Tests.Catalog.)
    steps:
      # First-party actions pinned to a major tag.
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: |
            code/api/**/*.csproj
            code/api/Directory.Build.props
      - run: dotnet build code/api/Lotties.sln
      # Every WebApplicationFactory host watches appsettings files; the runner allows 128 inotify
      # instances, so thousands of tests exhaust it. Tests never edit config: no reload, no watcher.
      - run: dotnet test ${{ matrix.target }} --no-build --filter "${{ matrix.filter }}"
        env:
          DOTNET_hostBuilder__reloadConfigOnChange: 'false'

  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: code/web/package-lock.json
      - run: npm ci
        working-directory: code/web
      - run: npm run lint
        working-directory: code/web
      - run: npm run build
        working-directory: code/web
      # Informational: reports known vulnerabilities in production dependencies without failing the build.
      - name: npm audit (informational)
        run: npm audit --omit=dev --audit-level=high
        working-directory: code/web
        continue-on-error: true

  # The vitest suite (hundreds of files, one worker each) split in five shards that run side by side.
  web-test:
    name: web test (${{ matrix.shard }}/5)
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: code/web/package-lock.json
      - run: npm ci
        working-directory: code/web
      - run: npm run test -- --run --shard=${{ matrix.shard }}/5
        working-directory: code/web

  # The one check to require in branch protection: skipped suites (nothing relevant changed) pass, failed or cancelled ones do not.
  ci-ok:
    if: always()
    needs: [changes, api, web, web-test]
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          case " $RESULTS " in *" failure "*|*" cancelled "*) exit 1 ;; esac
