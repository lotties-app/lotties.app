name: Feature request
description: Suggest an idea or an improvement
labels: ["enhancement", "needs-triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Idea
      description: What would you like to see? Alternatives you considered are welcome.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [Web app, API, Mobile app, Deploy, Docs, Not sure]
    validations:
      required: true
  - type: markdown
    attributes:
      value: Lotties shows facts and logged data, never medical advice or doses. Ideas that need clinical claims will be discussed before any work.
