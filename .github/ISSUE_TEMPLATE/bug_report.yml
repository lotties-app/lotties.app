name: Bug report
description: Something does not work as expected
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Do not include a real child's name, dates, events or photos. Use synthetic data or redact. Security problems go through the private report link on the issue chooser.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, what you saw instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [Web app, API, Mobile app, Deploy, Docs, Not sure]
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Shown on the About page, for example 0.1.54.
  - type: input
    id: env
    attributes:
      label: Device and browser
      description: For example iPhone 15 / iOS 18 / Safari, or Android 15 / Chrome 130, or the installed PWA.
