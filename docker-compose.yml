# Quick start: cp .env.example .env, fill it in, then `docker compose up --build`.
# Add `--profile localdb` to also start a local PostgreSQL. See docs/DEPLOY.md.
services:
  api:
    build: ./code/api
    environment:
      ASPNETCORE_URLS: http://+:8080
      DB_HOST: ${DB_HOST:?set DB_HOST in .env}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-babyroutine}
      DB_APP_USER: ${DB_APP_USER:?set DB_APP_USER in .env}
      DB_APP_PASSWORD: ${DB_APP_PASSWORD:?set DB_APP_PASSWORD in .env}
      # Opt-in: apply pending migrations at startup (docs/DEPLOY.md "Applying migrations"). The migrator
      # credentials fall back to DB_APP_*; they are only used when DB_AUTO_MIGRATE is true.
      DB_AUTO_MIGRATE: ${DB_AUTO_MIGRATE:-false}
      DB_MIGRATOR_USER: ${DB_MIGRATOR_USER:-}
      DB_MIGRATOR_PASSWORD: ${DB_MIGRATOR_PASSWORD:-}
      AUTH_AUTHORITY: ${AUTH_AUTHORITY:?set AUTH_AUTHORITY in .env}
      AUTH_AUDIENCE: ${AUTH_AUDIENCE:?set AUTH_AUDIENCE in .env}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      PUSH_VAPID_PUBLIC_KEY: ${PUSH_VAPID_PUBLIC_KEY:-}
      PUSH_VAPID_PRIVATE_KEY: ${PUSH_VAPID_PRIVATE_KEY:-}
      PUSH_VAPID_SUBJECT: ${PUSH_VAPID_SUBJECT:-}
    # Not published to the host: the browser reaches the API through the web container (/api/).
    expose:
      - "8080"
    depends_on:
      postgres:
        condition: service_healthy
        required: false # only present with --profile localdb
    # Repeated here because podman builds OCI images by default, which drop the Dockerfile HEALTHCHECK.
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /health HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && head -n1 <&3 | grep -q ' 200 '"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    restart: unless-stopped

  web:
    build:
      context: ./code/web
      args:
        # Empty = same origin (nginx proxies /api/ to the api service).
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
        VITE_OIDC_AUTHORITY: ${VITE_OIDC_AUTHORITY:?set VITE_OIDC_AUTHORITY in .env}
        VITE_OIDC_CLIENT_ID: ${VITE_OIDC_CLIENT_ID:?set VITE_OIDC_CLIENT_ID in .env}
        VITE_OIDC_AUDIENCE: ${VITE_OIDC_AUDIENCE:-}
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      - api
    restart: unless-stopped

  # Optional local PostgreSQL for contributors without a database: docker compose --profile localdb up
  # The superuser created here is DB_APP_USER, so the api can connect and migrations can be applied
  # with the same role. Set POSTGRES_PASSWORD equal to DB_APP_PASSWORD. For anything beyond local
  # development use an external database with separate migrator/app roles (docs/DEPLOY.md).
  postgres:
    image: postgres:16
    profiles: ["localdb"]
    environment:
      POSTGRES_DB: ${DB_NAME:-babyroutine}
      POSTGRES_USER: ${DB_APP_USER:-baby_app}
      # No default on purpose: the postgres image refuses to initialise with an empty password.
      # (`:?` would break `docker compose up` for users who do not use this profile.)
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432" # loopback only, never exposed to the network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  pgdata:
