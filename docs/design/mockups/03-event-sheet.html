<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Event sheet prototype</title>
<meta name="description" content="Interaction prototype 03-C: the full add/edit event sheet and its field library (segmented, chips, stepper, duration, time scrubber, notes, medication) with states, validation and undo.">
<style>
:root{
  --page:#0b0a1a;--bg:#15132e;--surface:#1f1c3f;--raised:#2a2468;--field:#29245e;--toast:#332c7a;--hair:#2a2652;
  --text:#eceaff;--muted:#a9a5d4;--accent:#7c6cf0;--accent-soft:#c4baff;--error:#ff9fb2;--error-bg:#4b2a33;
  --sleep-bg:#3a2f7a;--sleep-fg:#c4baff;--feeding-bg:#16423f;--feeding-fg:#7ee0b8;--diaper-bg:#4a3322;--diaper-fg:#ffc58a;
  --health-bg:#4b2a33;--health-fg:#ff9fb2;--care-bg:#183f55;--care-fg:#8fd8ff;--activity-bg:#4a3d1a;--activity-fg:#ffd77a;
  --nightWaking-bg:#4a2f55;--nightWaking-fg:#f0b6ff;--custom-bg:#33305a;--custom-fg:#dcd8ff;--ease:cubic-bezier(.2,.7,.2,1);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--page);color:var(--text);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input,textarea{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent-soft);outline-offset:2px}
.tnum{font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
svg{flex:none}
.stage{display:flex;gap:32px;justify-content:center;align-items:flex-start;padding:24px}
.phone{width:390px;height:844px;border-radius:44px;background:var(--bg);position:relative;overflow:hidden;box-shadow:0 0 0 10px #000,0 30px 80px rgba(0,0,0,.6);flex:none}
.screen{--s:1;position:absolute;top:0;left:0;width:calc(100% / var(--s));height:calc(100% / var(--s));transform:scale(var(--s));transform-origin:0 0;display:flex;flex-direction:column}
@media (max-width:480px){.stage{padding:0;display:block}.phone{width:100vw;height:100dvh;border-radius:0;box-shadow:none}.notes{padding:20px}}
/* timeline behind */
.tl{flex:1;overflow:auto;padding:20px}
.tl h1{font-size:20px;font-weight:500;margin:4px 0 14px}
.trow{display:grid;grid-template-columns:56px 36px 1fr;gap:10px;align-items:center;width:100%;min-height:58px;text-align:left;border-radius:14px}
.trow .time{font-size:13px;color:var(--muted);text-align:right;white-space:nowrap}
.trow b{font-weight:500;display:block}.trow span{font-size:13px;color:var(--muted)}
.trow.fresh{background:rgba(124,108,240,.2)}
.circ{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;flex:none}
.circ.s{width:34px;height:34px}
/* sheet */
.overlay{position:absolute;inset:0;z-index:10}
.overlay[hidden]{display:none}
.scrim{position:absolute;inset:0;background:rgba(5,4,15,.62)}
.sheet{position:absolute;left:0;right:0;bottom:0;height:94%;display:flex;flex-direction:column;background:var(--surface);border-radius:24px 24px 0 0;animation:up .2s var(--ease)}
.handle{display:flex;justify-content:center;padding:10px 0 2px}.handle i{width:36px;height:4px;border-radius:2px;background:#4a4580}
.head{display:flex;align-items:center;gap:6px;padding:2px 8px 0}
.iconbtn{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;color:var(--muted);flex:none}
.typebtn{flex:1;display:flex;align-items:center;gap:10px;min-height:52px;padding:0 6px;border-radius:16px;text-align:left;min-width:0}
.typebtn .nm{font-size:20px;font-weight:500;display:flex;align-items:center;gap:4px}
.typebtn .sub{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.typebtn .tx{min-width:0}
.body{flex:1;overflow-y:auto;padding:4px 20px 24px;scrollbar-width:none;position:relative}
.banner{display:flex;align-items:center;gap:10px;background:var(--raised);border-radius:14px;padding:8px 8px 8px 12px;margin:8px 0;font-size:13px}
.banner span{flex:1}
.lbl{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:500;color:var(--muted);margin:20px 0 8px;letter-spacing:.01em}
.lbl .opt{font-weight:400;opacity:.8}
.fieldwrap{border-radius:18px;transition:box-shadow .18s}
.fieldwrap.err .ctrl{box-shadow:0 0 0 2px var(--error);border-radius:18px}
.errmsg{display:flex;align-items:center;gap:6px;color:var(--error);font-size:13px;margin-top:6px}
.enter{animation:enter .18s var(--ease)}
/* when */
.pills{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px}
.pills.one{grid-template-columns:1fr}
.tpill{display:flex;flex-direction:column;align-items:flex-start;justify-content:center;min-height:64px;padding:8px 14px;border-radius:16px;background:var(--field);text-align:left;min-width:0}
.tpill small{font-size:12px;color:var(--muted)}
.tpill b{font-size:20px;font-weight:500;white-space:nowrap}
.tpill[aria-expanded="true"]{box-shadow:inset 0 0 0 2px var(--accent)}
.tpill.run b{color:var(--accent-soft)}
.durchip{display:flex;flex-direction:column;align-items:center;min-width:64px;min-height:48px;justify-content:center;padding:0 8px;border-radius:999px;background:rgba(196,186,255,.12);font-size:13px;font-weight:500;color:var(--accent-soft)}
.durchip[aria-expanded="true"]{background:var(--accent);color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 14px;border-radius:999px;background:rgba(196,186,255,.12);font-size:14px;white-space:nowrap}
.chip.sm{min-height:38px;padding:0 12px;font-size:13px}
.chip[aria-pressed="true"],.chip[aria-checked="true"]{background:var(--accent);color:#fff}
.chip .last{font-size:11px;opacity:.75}
.switchrow{display:flex;align-items:center;gap:12px;min-height:52px;width:100%;text-align:left;margin-top:10px}
.switchrow span.t{flex:1}
.sw{width:52px;height:32px;border-radius:999px;background:#3b366f;position:relative;flex:none;transition:background .15s}
.sw i{position:absolute;top:4px;left:4px;width:24px;height:24px;border-radius:50%;background:#cfcaf5;transition:transform .15s}
[aria-checked="true"] .sw{background:var(--accent)}[aria-checked="true"] .sw i{transform:translateX(20px);background:#fff}
.picker{margin-top:10px;background:var(--bg);border-radius:18px;padding:12px}
.hhmm{display:flex;align-items:center;justify-content:center;gap:6px;margin:8px 0}
.unit{display:flex;flex-direction:column;align-items:center}
.unit input{width:84px;height:64px;text-align:center;font-size:36px;font-weight:500;background:var(--field);border:0;border-radius:14px;font-variant-numeric:tabular-nums}
.unit button{width:84px;height:40px;display:grid;place-items:center;color:var(--muted)}
.colon{font-size:32px;font-weight:500;padding-bottom:4px}
.ampm{display:flex;flex-direction:column;gap:4px;margin-left:8px}
.ampm button{min-width:52px;min-height:40px;border-radius:10px;background:var(--field);font-size:13px;font-weight:600}
.ampm button[aria-pressed="true"]{background:var(--accent);color:#fff}
.ruler{position:relative;height:64px;overflow:hidden;border-radius:12px;background:var(--surface);touch-action:none;cursor:ew-resize;margin-top:6px}
.ruler .center{position:absolute;left:50%;top:6px;bottom:6px;width:3px;margin-left:-1.5px;border-radius:2px;background:var(--accent-soft);z-index:2}
.tick{position:absolute;bottom:10px;width:1px;background:#5a5594}
.tick.q{height:12px}.tick.f{height:6px}.tick.h{height:20px;background:#8f8ac0}
.tlab{position:absolute;top:6px;font-size:11px;color:var(--muted);transform:translateX(-50%);white-space:nowrap}
.future{position:absolute;top:0;bottom:0;right:-2000px;background:repeating-linear-gradient(135deg,rgba(0,0,0,.35) 0 6px,transparent 6px 12px)}
.evdot{position:absolute;bottom:30px;width:8px;height:8px;margin-left:-4px;border-radius:50%}
.rel{text-align:center;font-size:13px;color:var(--muted);margin-top:6px}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:8px}
.days button{min-height:48px;border-radius:12px;background:var(--field);font-size:12px;line-height:1.1}
.days button[aria-pressed="true"]{background:var(--accent);color:#fff}
/* field controls */
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;background:rgba(0,0,0,.22);padding:4px;border-radius:18px}
.seg button{min-height:52px;border-radius:14px;display:flex;align-items:center;justify-content:center;gap:8px;font-size:14px;color:var(--muted);padding:4px 6px;text-align:center;line-height:1.15}
.seg button[aria-checked="true"]{background:var(--raised);color:var(--text);box-shadow:inset 0 0 0 1.5px var(--accent-soft)}
.seg button{min-width:0}
.ctrl{container-type:inline-size}
/* large text or narrow screens: controls reflow instead of clipping */
@container (max-width:320px){
  .ctrl .seg{grid-auto-flow:row}.ctrl .seg button{justify-content:flex-start;padding:8px 14px}
  .ctrl .seg.big button{flex-direction:row;min-height:64px}
  .ctrl .duo{grid-template-columns:1fr}
  .ctrl .med .dose{padding-left:12px}
  .ctrl .pills:not(.one){grid-template-columns:1fr 1fr}.ctrl .pills .durchip{grid-column:1 / -1;order:3}
}
.picker{container-type:inline-size}
@container (max-width:300px){.picker .hhmm{flex-wrap:wrap}.picker .unit input{width:68px}.picker .unit button{width:68px}.picker .ampm{flex-direction:row;margin:4px 0 0;width:100%;justify-content:center}}
.seg.big{background:none;padding:0;gap:10px}
.seg.big button{flex-direction:column;min-height:96px;background:var(--field);border-radius:18px;font-size:15px;color:var(--text)}
.seg.big button[aria-checked="true"]{box-shadow:inset 0 0 0 2.5px var(--accent-soft);background:var(--raised)}
.num{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--field);border-radius:18px;padding:8px}
.round{width:56px;height:56px;border-radius:50%;background:rgba(255,255,255,.07);display:grid;place-items:center;flex:none}
.num .val{display:flex;align-items:baseline;justify-content:center;gap:4px;flex:1;min-width:0}
.num input{width:100%;max-width:150px;text-align:center;font-size:34px;font-weight:500;background:none;border:0;font-variant-numeric:tabular-nums}
.num .u{font-size:16px;color:var(--muted)}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mini{background:var(--field);border-radius:18px;padding:10px}
.mini .h{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.mini .r{display:flex;align-items:center;justify-content:space-between;margin-top:6px}
.mini .round{width:44px;height:44px}
.mini input{width:56px;text-align:center;font-size:24px;font-weight:500;background:none;border:0;font-variant-numeric:tabular-nums}
.mini .u{font-size:12px;color:var(--muted);text-align:center;display:block;margin-top:-2px}
.text{display:flex;align-items:center;gap:10px;min-height:52px;padding:0 14px;border-radius:16px;background:var(--field)}
.text input{flex:1;min-width:0;background:none;border:0;outline:none;font-size:16px;height:48px}
.scale{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.scale button{min-height:60px;border-radius:16px;background:var(--field);font-size:20px;font-weight:500}
.scale button[aria-checked="true"]{background:var(--accent);color:#fff}
.anch{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:6px}
.addnote{display:flex;align-items:center;gap:10px;min-height:52px;width:100%;color:var(--accent-soft);margin-top:16px;padding:0 4px}
textarea{width:100%;min-height:96px;resize:vertical;background:var(--field);border:0;border-radius:16px;padding:12px 14px;font-size:16px;outline:none}
.count{text-align:right;font-size:12px;color:var(--muted);margin-top:4px}
.med{background:var(--field);border-radius:18px;margin-bottom:8px}
.med .top{display:flex;align-items:center;gap:12px;width:100%;min-height:60px;padding:8px 12px;text-align:left}
.med .box{width:26px;height:26px;border-radius:50%;border:2px solid var(--muted);display:grid;place-items:center;flex:none}
.med[data-on="true"] .box{background:var(--accent);border-color:var(--accent)}
.med .nm{flex:1}.med .nm small{display:block;font-size:12px;color:var(--muted)}
.tag{font-size:11px;padding:2px 8px;border-radius:999px;background:rgba(126,224,184,.16);color:var(--feeding-fg);margin-left:6px;vertical-align:2px}
.med .dose{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:0 12px 12px 50px}
.tpill.run b{white-space:normal;line-height:1.15}
.med .dose input{width:64px;height:44px;text-align:center;background:var(--bg);border:0;border-radius:12px;font-size:18px;font-weight:500}
.med .dose .round{width:44px;height:44px}
.units{display:flex;gap:4px;margin-left:auto}
.units button{min-height:36px;min-width:44px;padding:0 8px;border-radius:999px;font-size:12px;background:rgba(255,255,255,.06)}
.units button[aria-checked="true"]{background:var(--accent);color:#fff}
.addrow{display:flex;align-items:center;gap:10px;min-height:52px;width:100%;padding:0 12px;border-radius:16px;border:1.5px dashed #5a5594;color:var(--accent-soft);margin-bottom:8px}
.foot{padding:10px 16px 16px;border-top:1px solid var(--hair);background:var(--surface)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 18px;border-radius:999px;font-weight:500}
.btn.primary{background:var(--accent);color:#fff}.btn.tonal{background:rgba(196,186,255,.16)}.btn.ghost{color:var(--accent-soft)}.btn.danger{background:var(--error);color:#3b0d18}
.btn.block{width:100%;min-height:56px;font-size:16px}
.confirm{display:flex;align-items:center;gap:8px}.confirm span{flex:1;font-size:14px}
.menu{position:absolute;right:12px;top:64px;z-index:5;min-width:210px;background:#2f2970;border-radius:16px;padding:6px;box-shadow:0 16px 40px rgba(0,0,0,.55)}
.menu button{display:flex;align-items:center;gap:12px;width:100%;min-height:48px;padding:0 12px;border-radius:10px;text-align:left}
.menu button:hover{background:rgba(255,255,255,.08)}
.types{position:absolute;left:12px;right:12px;top:64px;z-index:5;background:#2f2970;border-radius:18px;padding:8px;box-shadow:0 16px 40px rgba(0,0,0,.55);display:grid;grid-template-columns:1fr 1fr;gap:4px}
.types button{display:flex;align-items:center;gap:10px;min-height:52px;padding:0 8px;border-radius:12px;text-align:left;font-size:14px}
.types button[aria-current="true"]{background:rgba(255,255,255,.1)}
.toast{position:absolute;left:12px;right:12px;bottom:16px;z-index:20;background:var(--toast);border-radius:20px;padding:10px 10px 10px 14px;display:flex;align-items:center;gap:12px;box-shadow:0 12px 32px rgba(0,0,0,.5);opacity:0;transform:translateY(8px);transition:opacity .18s,transform .18s;pointer-events:none}
.toast.show{opacity:1;transform:none;pointer-events:auto}
.toast .tx{flex:1}.toast b{font-weight:500;display:block}.toast span{font-size:13px;color:var(--muted)}
.notes{max-width:380px;font-size:14px;color:var(--muted)}
.notes h1{font-size:18px;color:var(--text);margin:4px 0 8px}.notes h2{font-size:14px;color:var(--text);margin:18px 0 6px}
.ctl{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.ctl button{display:inline-flex;align-items:center;min-height:36px;padding:0 12px;border-radius:999px;background:#1d1b38;font-size:13px}
.ctl button[aria-pressed="true"]{background:var(--accent)}
.notes ul{padding-left:18px}.notes li{margin:4px 0}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
@keyframes enter{from{opacity:0;transform:translateY(-6px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (forced-colors:active){.chip,.seg button,.tpill,.num,.mini,.med,.scale button,.btn{border:1px solid CanvasText}.seg button[aria-checked="true"],.chip[aria-pressed="true"],.scale button[aria-checked="true"]{outline:3px solid Highlight}}
</style>
</head>
<body>
<div class="stage">
<div class="phone" id="phone"><div class="screen" id="screen">
  <div class="tl" id="tl"></div>
  <div class="overlay" id="overlay" hidden>
    <div class="scrim" id="scrim"></div>
    <section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle"></section>
  </div>
  <div class="toast" id="toast" role="status"></div>
  <div class="sr" id="live" aria-live="polite"></div>
</div></div>
<aside class="notes" id="notes"></aside>
</div>

/* ---------- ruler ---------- */
const PX=4;
function syncRuler(){
  const r=$('#ruler');if(!r)return;const ms=ui.picker==='start'?F.start:F.end;const w=r.clientWidth||320;const n=Date.now();
  const from=ms-Math.ceil(w/2/PX+30)*MIN,to=ms+Math.ceil(w/2/PX+30)*MIN;let h='';
  const x=tm=>w/2+(tm-ms)/MIN*PX;

  if(n<to)h+=`<span class="future" style="left:${x(n)}px"></span>`;
  for(const e of EVENTS){if(e.id===F.id)continue;if(e.start>from&&e.start<to)h+=`<i class="evdot" style="left:${x(e.start)}px;background:var(--${TYPES[e.type].cat}-fg)" title="${typeName(e.type)}"></i>`;}
  $('#track').innerHTML=h;

  const d=new Date(ms);const hh=$('[data-k="hh"]'),mm=$('[data-k="mm"]');
  if(hh&&document.activeElement!==hh)hh.value=String(S.lang==='pt'?d.getHours():(d.getHours()%12||12)).padStart(2,'0');
  if(mm&&document.activeElement!==mm)mm.value=String(d.getMinutes()).padStart(2,'0');
  document.querySelectorAll('[data-k="am"],[data-k="pm"]').forEach(b=>b.setAttribute('aria-pressed',String((b.dataset.k==='pm')===(d.getHours()>=12))));
  const pill=$(`[data-k="pick-${ui.picker}"] b`);if(pill)pill.textContent=TYPES[F.type].dur?fmtT(ms):whenText(ms);
  const dc=$('[data-k="dur"]');if(dc&&F.end!=null)dc.lastChild.textContent=fmtDur(F.end-F.start);
}
function setEdge(ms,{silent}={}){
  ms=Math.round(ms/MIN)*MIN;const n=Date.now();
  if(ms>n){ms=Math.floor(n/MIN)*MIN;ui.errors.time=t('future');}else if(ui.errors.time===t('future'))delete ui.errors.time;

    if(f.req&&(v==null||v===''))er[f.key]=f.kind==='number'?t('reqNum'):t('reqChoice');
    if(f.kind==='number'&&v!=null&&v!==''){if(f.max!=null&&v>f.max)er[f.key]=t('max',{v:fmtNum(f.max),u:f.unit||''});if(f.min!=null&&v<f.min)er[f.key]=t('min',{v:fmtNum(f.min),u:f.unit||''});}}

}

let toastT=null,undoFn=null;

  if(k.startsWith('sc-')){const [,key,n]=k.split('-');F.values[key]=+n;delete ui.errors[key];render(k);return;}
  if(k.startsWith('n-')||k.startsWith('p-')){const f=ty.fields.find(x=>x.key===k.slice(2));stepNum(f,k[0]==='p'?1:-1);render(k);return;}
  if(k.startsWith('qv-')){const [,key,q]=k.split('-');F.values[key]=+q;delete ui.errors[key];render(k);return;}
  if(k.startsWith('dm-')||k.startsWith('dp-')){const key=k.slice(3);const cur=F.values[key]||0;F.values[key]=Math.max(0,cur+(k[1]==='p'?60:-60));render(k);return;}
  if(k.startsWith('txt-')){const [,key,...s]=k.split('-');F.values[key]=s.join('-');render('in-'+key);return;}
  if(k.startsWith('b-')){const key=k.slice(2);F.values[key]=F.values[key]!==true;render(k);return;}
  if(k==='addnote'){ui.note=true;render('notes');return;}
  if(k.startsWith('med-')){const id=k.slice(4);const m=MEDS.find(x=>x.id===id);if(F.meds[id])delete F.meds[id];else F.meds[id]={dose:m.dose,unit:m.unit};delete ui.errors.meds;render(k);return;}
  if(k.startsWith('md-')||k.startsWith('mp-')){const id=k.slice(3);const s=F.meds[id];const step=s.unit==='drops'?1:s.unit==='mg'?5:0.5;s.dose=Math.max(step,Math.round((s.dose+(k[1]==='p'?step:-step))*100)/100);render(k);return;}
  if(k.startsWith('mu-')){const [,id,u]=k.split('-');F.meds[id].unit=u;render(k);return;}
  if(k==='addmed'){const name=ui.medQ.trim();const m={id:uid(),name:name.charAt(0).toUpperCase()+name.slice(1),dose:1,unit:'ml',usual:false};MEDS.push(m);F.meds[m.id]={dose:1,unit:'ml'};ui.medQ='';delete ui.errors.meds;render('mi-'+m.id);return;}
}
const sheet=$('#sheet');
sheet.addEventListener('click',e=>{const b=e.target.closest('button[data-k]');if(b&&!b.disabled)act(b.dataset.k);});
// press-and-hold on steppers repeats (after 400 ms, then every 90 ms)
sheet.addEventListener('pointerdown',e=>{const b=e.target.closest('button[data-k]');if(!b)return;const k=b.dataset.k;if(!/^(h[+-]|m[+-]|n-|p-|dm-|dp-|md-|mp-)/.test(k))return;
  clearTimeout(rep);rep=setTimeout(function loop(){act(k);rep=setTimeout(loop,90);},400);});
['pointerup','pointercancel','pointerleave'].forEach(n=>sheet.addEventListener(n,()=>clearTimeout(rep),true));
sheet.addEventListener('input',e=>{const k=e.target.dataset.k;if(!k)return;const ty=TYPES[F.type];const raw=e.target.value;
  if(k==='notes'){F.notes=raw;return;}
  if(k==='medq'){ui.medQ=raw;const pos=e.target.selectionStart;render('medq');const el=$('[data-k="medq"]');el.setSelectionRange(pos,pos);return;}
  if(k==='hh'&&raw.length===2){$('[data-k="mm"]').focus();$('[data-k="mm"]').select();}
  if(k.startsWith('in-')){const key=k.slice(3);const f=ty.fields.find(x=>x.key===key)||{kind:'duration'};
    if(f.kind==='text'){F.values[key]=raw;return;}
    const n=parseFloat(raw.replace(',','.'));if(f.kind==='duration'){F.values[key]=isNaN(n)?undefined:Math.round(n*60);return;}
    F.values[key]=isNaN(n)?undefined:n;delete ui.errors[key];}
  if(k.startsWith('mi-')){const n=parseFloat(raw.replace(',','.'));if(!isNaN(n))F.meds[k.slice(3)].dose=n;}
});
sheet.addEventListener('change',e=>{const k=e.target.dataset.k;if(!k)return;
  if(k==='hh'||k==='mm'){const cur=ui.picker==='start'?F.start:F.end;const d=new Date(cur);let v=parseInt(e.target.value,10);if(isNaN(v)){syncRuler();return;}
    if(k==='hh'){if(S.lang!=='pt'){const pm=d.getHours()>=12;v=v%12+(pm?12:0);}d.setHours(Math.min(23,v));}else d.setMinutes(Math.min(59,v));setEdge(d.getTime(),{silent:true});return;}
  if(k.startsWith('in-')||k.startsWith('mi-'))render(k);
});
sheet.addEventListener('keydown',e=>{
  const g=e.target.closest('[role="radiogroup"]');
  if(g&&['ArrowRight','ArrowLeft','ArrowDown','ArrowUp'].includes(e.key)){const items=[...g.querySelectorAll('[role="radio"]')];const i=items.indexOf(e.target);const ni=(i+(e.key==='ArrowRight'||e.key==='ArrowDown'?1:-1)+items.length)%items.length;e.preventDefault();act(items[ni].dataset.k);}
});
$('#scrim').addEventListener('click',()=>close(false));
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#overlay').hidden){if(ui.types||ui.menu){ui.types=ui.menu=false;render('type');}else close(false);}});

/* ---------- side panel ---------- */
const SCEN=[
 ['Feeding · new (bottle, last used)',()=>openNew('feeding')],
 ['Nursing · edit (by Rafa)',()=>openEdit(EVENTS.find(e=>e.type==='feeding'&&e.values.method==='breast'))],
 ['Nap · running',()=>openEdit(EVENTS.find(e=>e.type==='sleep'&&e.end===null))],
 ['Diaper · new',()=>openNew('diaper')],['Medication · new',()=>openNew('medication')],['Belly pain · new',()=>openNew('belly_pain')],['Bath · new',()=>openNew('bath')],
 ['Custom type: Temperature',()=>openNew('temperature')]];
function renderNotes(){
  const en=S.lang==='en';
  $('#notes').innerHTML=`<h1>03-C Event sheet and field library</h1><p>${en?'The full sheet opens from long-press, “Edit” in a toast, “More details” in a tray, or a timeline row (try the rows behind the sheet).':'A ficha completa abre com toque longo, “Editar” no aviso, “Mais detalhes” na bandeja ou numa linha da linha do tempo.'}</p>
  <div class="ctl"><button aria-pressed="${S.lang==='en'}" data-lang="en">EN</button><button aria-pressed="${S.lang==='pt'}" data-lang="pt">PT-BR</button><button aria-pressed="${S.twins}" data-twins>Twins</button>
  ${[1,1.3,1.6].map(s=>`<button aria-pressed="${S.scale===s}" data-scale="${s}">${Math.round(s*100)}% text</button>`).join('')}</div>
  <h2>${en?'Scenarios':'Cenários'}</h2><div class="ctl">${SCEN.map(([l],i)=>`<button data-scen="${i}">${l}</button>`).join('')}</div>
  <h2>${en?'Things to try':'Experimente'}</h2><ul>
  <li>${en?'Feeding: switch How between Bottle, Breast and Solid. Fields that apply slide in; values of hidden fields are kept while you edit but never saved.':'Alimentação: troque entre Mamadeira, Peito e Sólida; campos ocultos nunca são salvos.'}</li>
  <li>${en?'Tap a time pill: Today / Yesterday / Other day, big HH:MM you can type or step (hold to repeat), and a ruler you can drag, scroll or arrow-key. Dots on the ruler are other events. The future is hatched and blocked.':'Toque num horário: Hoje/Ontem/Outro dia, HH:MM digitável e régua arrastável. Pontos são outros eventos.'}</li>
  <li>${en?'Tap the duration between Start and End to set it directly; it moves the end.':'Toque na duração entre Início e Fim para ajustá-la.'}</li>
  <li>${en?'Diaper or Belly pain: press Save without choosing. The error appears under the field, focus moves there, a screen reader hears “1 thing to fix”.':'Fralda ou Dor de barriga: Salvar sem escolher mostra o erro no campo.'}</li>
  <li>${en?'Change type from the title. A banner offers Undo. Edit mode: ⋯ has Duplicate and Delete (no confirm dialog, Undo instead).':'Troque o tipo pelo título (com Desfazer). Em edição, ⋯ tem Duplicar e Excluir com Desfazer.'}</li>
  <li>${en?'Close with unsaved changes: an inline “Discard your changes?” bar, not a modal.':'Fechar com alterações: barra “Descartar?” sem modal.'}</li>
  <li>${en?'PT-BR and 160% text: labels sit above controls and wrap; nothing is clipped.':'PT-BR e 160%: rótulos acima dos campos, nada cortado.'}</li></ul>`;
}
$('#notes').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
  if(b.dataset.lang){S.lang=b.dataset.lang;document.documentElement.lang=S.lang==='pt'?'pt-BR':'en';}
  if(b.hasAttribute('data-twins'))S.twins=!S.twins;
  if(b.dataset.scale){S.scale=+b.dataset.scale;$('#screen').style.setProperty('--s',S.scale);}
  if(b.dataset.scen!=null){SCEN[+b.dataset.scen][1]();renderNotes();return;}
  renderNotes();renderTL();if(!$('#overlay').hidden)render();});
seed();renderTL();renderNotes();openNew('feeding');
</script>
