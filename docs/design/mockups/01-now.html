<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Now screen wireframe</title>
<style>
  :root {
    --bg: #15132e; --surface: #1f1c3f; --raised: #2a2468; --hair: #2a2652;
    --text: #eceaff; --muted: #9d99c8; --accent: #7c6cf0; --accent-soft: #c4baff;
    --sleep-bg: #3a2f7a; --sleep-fg: #c4baff; --feed-bg: #16423f; --feed-fg: #7ee0b8;
    --diaper-bg: #4a3322; --diaper-fg: #ffc58a; --health-bg: #4b2a33; --health-fg: #ff9fb2;
    --care-bg: #183f55; --care-fg: #8fd8ff; --custom-bg: #2f2c4f; --custom-fg: #cfcbe8;
  }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 24px 16px 48px; background: #0e0c22; color: var(--text);
    font: 15px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; font-feature-settings: "tnum"; }
  .intro { max-width: 1680px; margin: 0 auto 20px; }
  .intro h1 { font-size: 20px; font-weight: 500; margin: 0 0 4px; }
  .intro p { margin: 0; color: var(--muted); font-size: 13px; max-width: 760px; }
  .row { display: flex; flex-wrap: wrap; gap: 28px; justify-content: center; }
  figure { margin: 0; }
  figcaption { font-size: 13px; color: var(--muted); margin: 0 0 8px 4px; max-width: 390px; }
  figcaption b { color: var(--text); font-weight: 500; }
  .phone { width: 390px; max-width: 100%; height: 844px; background: var(--bg); border-radius: 36px;
    position: relative; overflow: hidden; box-shadow: 0 0 0 1px #2a2652, 0 20px 60px rgba(0,0,0,.45);
    display: flex; flex-direction: column; }
  .status { height: 44px; padding: 14px 28px 0; font-size: 13px; font-weight: 600; display: flex; justify-content: space-between; }
  .scroll { flex: 1; overflow: auto; padding: 4px 20px 0; scrollbar-width: none; }
  svg.i { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
  svg.i.s { width: 18px; height: 18px; }
  /* header */
  .hdr { display: flex; align-items: center; gap: 12px; padding: 4px 0 10px; }
  .ava { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; font-weight: 600; background: var(--sleep-bg); color: var(--sleep-fg); flex: none; }
  .ava.sm { width: 32px; height: 32px; font-size: 13px; background: #24405a; color: #8fd8ff; }
  .hdr .name { font-size: 20px; font-weight: 500; line-height: 1.1; }
  .hdr .age { font-size: 12px; color: var(--muted); }
  .hdr .sp { flex: 1; }
  .iconbtn { width: 40px; height: 40px; display: grid; place-items: center; color: var(--muted); border-radius: 50%; }
  /* state card */
  .card { background: var(--surface); border-radius: 20px; padding: 18px 18px 16px; box-shadow: inset 0 1px 0 rgba(255,255,255,.04); }
  .pill { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px 4px 6px; border-radius: 999px; font-size: 13px; font-weight: 500; }
  .pill.care { background: var(--care-bg); color: var(--care-fg); }
  .pill.sleep { background: var(--sleep-bg); color: var(--sleep-fg); }
  .stateTop { display: flex; justify-content: space-between; align-items: center; }
  .caption { font-size: 12px; color: var(--muted); }
  .big { font-size: 32px; font-weight: 500; margin: 4px 0 0; letter-spacing: -.5px; }
  .pred { margin: 12px 0; padding: 12px; background: var(--bg); border-radius: 14px; }
  .pred .l { display: flex; justify-content: space-between; font-size: 13px; }
  .pred .l b { font-weight: 500; }
  .bar { position: relative; height: 8px; border-radius: 99px; background: var(--hair); margin: 10px 0 4px; }
  .bar .win { position: absolute; top: 0; bottom: 0; border-radius: 99px; background: rgba(124,108,240,.55); }
  .bar .now { position: absolute; top: -4px; width: 2px; height: 16px; background: var(--text); border-radius: 2px; }
  .bar + .ticks { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); }
  .primary { display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; height: 56px; border: 0; border-radius: 999px;
    background: var(--accent); color: #fff; font: 500 17px system-ui, sans-serif; }
  .ghost { display: block; text-align: center; margin-top: 10px; font-size: 13px; color: var(--accent-soft); }
  /* tiles */
  .sect { display: flex; justify-content: space-between; align-items: baseline; margin: 18px 0 8px; }
  .sect h2 { font-size: 15px; font-weight: 500; margin: 0; }
  .sect a { font-size: 13px; color: var(--accent-soft); text-decoration: none; }
  .tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .tile { background: var(--surface); border-radius: 16px; padding: 12px; min-height: 80px; position: relative; padding-left: 62px; }
  .tile .ic { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; position: absolute; left: 12px; top: 12px; }
  .why { font-weight: 400; color: var(--accent-soft); margin-left: 6px; font-size: 12px; }
  .tile .t { font-size: 15px; font-weight: 500; }
  .tile .s { font-size: 12px; color: var(--muted); }
  .tile .s.hi { color: var(--accent-soft); }
  .tile .plus { position: absolute; top: 12px; right: 12px; width: 28px; height: 28px; border-radius: 50%; background: var(--raised); display: grid; place-items: center; color: var(--accent-soft); }
  .feed { background: var(--feed-bg); color: var(--feed-fg); } .diaper { background: var(--diaper-bg); color: var(--diaper-fg); }
  .health { background: var(--health-bg); color: var(--health-fg); } .custom { background: var(--custom-bg); color: var(--custom-fg); }
  .sleepc { background: var(--sleep-bg); color: var(--sleep-fg); } .carec { background: var(--care-bg); color: var(--care-fg); }
  /* ribbon */
  .ribbon { background: var(--surface); border-radius: 16px; padding: 10px 12px; }
  .ribbon .sum { font-size: 12px; color: var(--muted); margin-bottom: 8px; }
  /* nav */
  .nav { height: 76px; padding-bottom: 12px; display: grid; grid-template-columns: repeat(3, 1fr); border-top: 1px solid var(--hair); background: var(--bg); }
  .nav div { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 12px; color: var(--muted); }
  .nav div.on { color: var(--text); }
  .nav div.on span.ind { background: var(--raised); color: var(--accent-soft); }
  .nav span.ind { width: 56px; height: 30px; border-radius: 999px; display: grid; place-items: center; }
  /* snackbar */
  .snack { position: absolute; left: 12px; right: 12px; bottom: 88px; background: #eceaff; color: #1b1838; border-radius: 14px; padding: 10px 10px 10px 14px;
    display: flex; align-items: center; gap: 6px; font-size: 14px; box-shadow: 0 10px 30px rgba(0,0,0,.4); }
  .snack .m { flex: 1; font-weight: 500; }
  .snack .c { border: 1px solid #c9c4ee; border-radius: 999px; padding: 6px 9px; font-size: 13px; }
  .snack .u { color: #5b4bd6; font-weight: 600; padding: 6px 6px; }
  /* catch-up */
  .catch { background: linear-gradient(180deg, #262158, var(--surface)); border-radius: 20px; padding: 16px; margin-bottom: 14px; box-shadow: inset 0 1px 0 rgba(255,255,255,.05); }
  .catch h3 { margin: 0; font-size: 15px; font-weight: 500; }
  .crow { display: flex; align-items: center; gap: 12px; padding: 8px 0; border-top: 1px solid var(--hair); font-size: 14px; }
  .crow:first-of-type { border-top: 0; }
  .crow .ic { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; }
  .crow .ic svg { width: 18px; height: 18px; }
  .crow .r { margin-left: auto; font-size: 12px; color: var(--muted); text-align: right; }
  .crow .r.hi { color: var(--accent-soft); }
  .btns { display: flex; gap: 8px; margin-top: 10px; }
  .btn2 { flex: 1; height: 44px; border-radius: 999px; border: 1px solid #3b3672; background: transparent; color: var(--text); font: 500 14px system-ui, sans-serif; display: flex; align-items: center; justify-content: center; gap: 6px; }
  .compact { display: flex; align-items: center; gap: 12px; }
  .compact .ic { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; }
  .compact .b { flex: 1; }
  .compact .b .t { font-size: 15px; font-weight: 500; }
  .stop { height: 44px; padding: 0 16px; border-radius: 999px; background: var(--accent); color: #fff; display: flex; align-items: center; gap: 6px; font-weight: 500; font-size: 14px; }
  /* sheet */
  .scrim { position: absolute; inset: 0; background: rgba(6,5,16,.6); }
  .sheet { position: absolute; left: 0; right: 0; bottom: 0; background: var(--surface); border-radius: 24px 24px 0 0; padding: 8px 20px 24px; }
  .handle { width: 36px; height: 4px; border-radius: 4px; background: #3b3672; margin: 0 auto 12px; }
  .shead { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
  .shead .ic { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; }
  .shead .t { font-size: 20px; font-weight: 500; }
  .label { font-size: 12px; font-weight: 500; color: var(--muted); margin: 14px 0 6px; }
  .seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 6px; background: var(--bg); border-radius: 14px; padding: 4px; }
  .seg div { height: 44px; border-radius: 10px; display: flex; align-items: center; justify-content: center; gap: 6px; font-size: 14px; color: var(--muted); }
  .seg div.on { background: var(--raised); color: var(--text); font-weight: 500; }
  .amount { display: flex; align-items: center; justify-content: space-between; background: var(--bg); border-radius: 14px; padding: 8px; }
  .amount .v { font-size: 32px; font-weight: 500; } .amount .v small { font-size: 16px; color: var(--muted); margin-left: 4px; }
  .round { width: 48px; height: 48px; border-radius: 50%; background: var(--raised); display: grid; place-items: center; font-size: 24px; color: var(--accent-soft); }
  .chips { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
  .chip { height: 36px; padding: 0 14px; border-radius: 999px; border: 1px solid #3b3672; display: flex; align-items: center; font-size: 13px; color: var(--text); }
  .chip.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  .note { display: flex; align-items: center; gap: 10px; margin-top: 16px; font-size: 14px; color: var(--muted); }
  .note-help { font-size: 12px; color: var(--muted); text-align: center; margin-top: 8px; }
</style>
</head>

<div class="intro">
  <h1>01 · Now: the recommended home (wireframe)</h1>
  <p>Structure and hierarchy only, not final visuals. Colours are the DESIGN.md §1 night tokens. Times are consistent across frames: Vini is on duty in frames 1, 2 and 4; Ana opens the app at 14:54 in frame 3. See docs/design/01-ux-strategy.md.</p>
</div>

<div class="row">

<!-- Frame 1: awake -->
<figure>

</figure>

<!-- Frame 3: partner returns -->
<figure>
  <figcaption><b>3. Handover (Ana opens the app at 14:54).</b> A catch-up card shows who logged what, and when the next dose is allowed. Share sends it as plain text to a nanny who has no app. Nothing to navigate.</figcaption>
  <div class="phone">
    <div class="status"><span>14:54</span><span>●●● 5G</span></div>
    <div class="scroll">
      <div class="hdr">
        <div class="ava">L</div>
        <div><div class="name">Lia</div><div class="age">2 months, 3 weeks</div></div>
        <div class="sp"></div>
        <div class="iconbtn"><svg class="i"><use href="#cloud"/></svg></div>
        <div class="ava sm" style="background:#4b2a33;color:#ff9fb2">A</div>
      </div>

      <div class="catch">
        <div style="display:flex;align-items:center;gap:10px;margin-bottom:6px">
          <div class="ava sm">V</div>
