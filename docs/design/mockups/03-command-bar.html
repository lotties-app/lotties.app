<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Command bar prototype</title>
<meta name="description" content="Interaction prototype 03-B: Track sheet with suggestions, repeat-last and a natural-language quick-entry bar (en + pt-BR) with a live parse preview.">
<style>
:root{
  --page:#0b0a1a;--bg:#15132e;--surface:#1f1c3f;--raised:#2a2468;--toast:#332c7a;--hair:#2a2652;
  --text:#eceaff;--muted:#a9a5d4;--accent:#7c6cf0;--accent-soft:#c4baff;
  --sleep-bg:#3a2f7a;--sleep-fg:#c4baff;--feeding-bg:#16423f;--feeding-fg:#7ee0b8;--diaper-bg:#4a3322;--diaper-fg:#ffc58a;
  --health-bg:#4b2a33;--health-fg:#ff9fb2;--care-bg:#183f55;--care-fg:#8fd8ff;--activity-bg:#4a3d1a;--activity-fg:#ffd77a;
  --nightWaking-bg:#4a2f55;--nightWaking-fg:#f0b6ff;--warn-bg:#4a3518;--warn-fg:#ffcf8a;--ease:cubic-bezier(.2,.7,.2,1);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--page);color:var(--text);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--accent-soft);outline-offset:2px}
.tnum{font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.stage{display:flex;gap:32px;justify-content:center;align-items:flex-start;padding:24px}
.phone{width:390px;height:844px;border-radius:44px;background:var(--bg);position:relative;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 0 0 10px #000,0 30px 80px rgba(0,0,0,.6);flex:none}
@media (max-width:480px){.stage{padding:0;display:block}.phone{width:100vw;height:100dvh;border-radius:0;box-shadow:none}.notes{padding:20px}}
svg{flex:none}
.top{display:flex;align-items:center;gap:12px;padding:20px 16px 8px 20px}
.avatar{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-weight:600;color:#fff;background:#7c6cf0}
.name{font-size:20px;font-weight:500}.age{font-size:12px;color:var(--muted)}
main{flex:1;overflow:auto;padding:8px 20px 90px}
.card{background:var(--surface);border-radius:20px;padding:16px 18px}
.big{font-size:28px;font-weight:500}
.muted{color:var(--muted);font-size:13px}
.sect{display:flex;align-items:center;gap:8px;margin:22px 0 8px;font-size:15px;font-weight:500}
.rowi{display:grid;grid-template-columns:62px 36px 1fr;align-items:center;gap:10px;min-height:56px;border-radius:14px;transition:background .6s}
.rowi.fresh{background:rgba(124,108,240,.2)}
.rowi .time{font-size:13px;color:var(--muted);text-align:right;white-space:nowrap}
.rowi .t1{font-weight:500}.rowi .t2{font-size:13px;color:var(--muted)}
.circ{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;flex:none}
.circ.s{width:34px;height:34px}
.nav{position:absolute;left:0;right:0;bottom:0;display:grid;grid-template-columns:1fr 1fr 72px 1fr 1fr;height:64px;border-top:1px solid var(--hair);background:var(--bg)}
.nav span{display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:12px;color:var(--muted);gap:2px}
.fab{position:absolute;top:-22px;left:50%;transform:translateX(-50%);width:58px;height:58px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;box-shadow:0 0 0 6px rgba(124,108,240,.18)}
/* sheet */
.overlay{position:absolute;inset:0;z-index:10}
.overlay[hidden]{display:none}
.scrim{position:absolute;inset:0;background:rgba(5,4,15,.6)}
.sheet{position:absolute;left:0;right:0;bottom:0;height:92%;display:flex;flex-direction:column;background:var(--surface);border-radius:24px 24px 0 0;animation:up .2s var(--ease)}
.handle{display:flex;justify-content:center;padding:10px 0 4px}.handle i{width:36px;height:4px;border-radius:2px;background:#4a4580}
.sh-head{display:flex;align-items:center;gap:8px;padding:0 12px 0 8px}
.sh-head h2{flex:1;margin:0;font-size:20px;font-weight:500}
.iconbtn{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:var(--muted)}
.body{flex:1;overflow-y:auto;padding:4px 20px 12px;scrollbar-width:none}
.flabel{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:500;color:var(--muted);margin:16px 0 8px}
.sugs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.sug{display:flex;flex-direction:column;align-items:flex-start;gap:6px;min-height:104px;padding:10px;border-radius:16px;background:var(--raised);text-align:left}
.sug b{font-weight:500;font-size:14px;line-height:1.2}
.sug span{font-size:12px;color:var(--muted);line-height:1.2}
.rep{display:flex;align-items:center;gap:12px;width:100%;min-height:56px;padding:6px 8px 6px 4px;border-radius:14px;text-align:left}
.rep .tx{flex:1;min-width:0}.rep .tx b{display:block;font-weight:500;font-size:14px}.rep .tx span{font-size:12px;color:var(--muted)}
.rep .go{display:flex;align-items:center;gap:4px;color:var(--accent-soft);font-size:13px;font-weight:500;min-height:40px;padding:0 10px;border-radius:999px;background:rgba(196,186,255,.1)}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.tile{display:flex;flex-direction:column;align-items:center;gap:6px;min-height:84px;padding:8px 2px;border-radius:16px;background:var(--bg);font-size:12.5px;font-weight:500;text-align:center;line-height:1.15}
/* command dock */
.cmd{padding:8px 12px 14px;border-top:1px solid var(--hair);background:var(--surface)}
.preview{background:var(--bg);border-radius:18px;padding:12px;margin-bottom:8px}
.preview[hidden]{display:none}
.pv-title{display:flex;align-items:center;gap:10px}
.pv-title .tx{flex:1;min-width:0}.pv-title b{display:block;font-weight:500}.pv-title span{font-size:13px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:0 12px;border-radius:999px;background:rgba(196,186,255,.12);font-size:13px;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--accent);color:#fff}
.chip.unk{background:none;border:1.5px dashed #6b66a8;color:var(--muted)}
.chip.need{background:none;border:1.5px solid var(--warn-fg);color:var(--warn-fg)}
.chip .x{margin-right:-6px;opacity:.7}
.fieldrow{display:flex;align-items:center;gap:8px}
.field{flex:1;display:flex;align-items:center;gap:8px;min-height:52px;padding:0 6px 0 14px;border-radius:999px;background:var(--raised)}
.field input{flex:1;min-width:0;background:none;border:0;outline:none;font-size:16px;height:48px}
.field input::placeholder{color:var(--muted)}
.send{width:52px;height:52px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center}
.send:disabled{background:#3a3570;color:#8f8ac0;cursor:default}
.mic.on{background:var(--health-fg);color:#3b0d18;animation:pulse 1s infinite}
.ac{display:flex;flex-direction:column;gap:2px;margin-bottom:6px}
.ac button{display:flex;align-items:center;gap:10px;min-height:44px;padding:0 10px;border-radius:12px;text-align:left;font-size:14px}
.ac button:hover,.ac button:focus-visible{background:rgba(255,255,255,.06)}
.ac small{color:var(--muted);margin-left:auto;font-size:12px}
.toast{position:absolute;left:12px;right:12px;bottom:76px;z-index:20;background:var(--toast);border-radius:20px;padding:12px;display:flex;align-items:center;gap:12px;box-shadow:0 12px 32px rgba(0,0,0,.5);transition:opacity .18s,transform .18s;opacity:0;transform:translateY(8px);pointer-events:none}
.toast.show{opacity:1;transform:none;pointer-events:auto}
.toast .tx{flex:1;min-width:0}.toast b{display:block;font-weight:500}.toast span{font-size:13px;color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:48px;padding:0 16px;border-radius:999px;font-weight:500}
.btn.primary{background:var(--accent);color:#fff}.btn.tonal{background:rgba(196,186,255,.16)}.btn.ghost{color:var(--accent-soft)}
.btn.block{width:100%}
.modal{position:absolute;inset:0;z-index:30;display:grid;place-items:end center}
.modal[hidden]{display:none}
.modal .box{position:relative;width:100%;background:#25215a;border-radius:24px 24px 0 0;padding:20px 20px 24px}
.modal h3{margin:8px 0 8px;font-size:18px;font-weight:500}
.modal p{margin:0 0 10px;color:var(--muted);font-size:14px}
.listening{display:flex;align-items:center;gap:10px;color:var(--health-fg);font-size:13px;margin-bottom:8px}
.listening[hidden]{display:none}
.dots i{display:inline-block;width:6px;height:6px;margin:0 2px;border-radius:50%;background:currentColor;animation:bounce 1s infinite}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
.notes{max-width:380px;font-size:14px;color:var(--muted)}
.notes h1{font-size:18px;color:var(--text);margin:4px 0 8px}
.notes h2{font-size:14px;color:var(--text);margin:18px 0 6px}
.ctl{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.ctl button{display:inline-flex;align-items:center;min-height:36px;padding:0 12px;border-radius:999px;background:#1d1b38;font-size:13px}
.ctl button[aria-pressed="true"]{background:var(--accent)}
.ex button{background:#1d1b38;border-radius:10px;padding:6px 10px;margin:3px 2px;font-size:13px;color:var(--text);text-align:left}
code{background:#1d1b38;padding:1px 5px;border-radius:5px}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
@keyframes pulse{50%{box-shadow:0 0 0 8px rgba(255,159,178,.15)}}
@keyframes bounce{50%{transform:translateY(-4px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (forced-colors:active){.chip,.tile,.sug,.btn,.field{border:1px solid CanvasText}}
</style>
</head>
<body>
<div class="stage">
<div class="phone" id="phone">
  <header class="top"><span class="avatar" id="av">A</span><div><div class="name" id="bname">Alice</div><div class="age" id="age"></div></div></header>
  <main id="main"></main>
  <nav class="nav" id="nav"></nav>
  <div class="toast" id="toast" role="status"></div>
  <div class="overlay" id="overlay">
    <div class="scrim" id="scrim"></div>
    <section class="sheet" role="dialog" aria-modal="true" aria-labelledby="trackTitle">
      <div class="handle" aria-hidden="true"><i></i></div>
      <div class="sh-head"><button class="iconbtn" id="close" aria-label="Close"></button><h2 id="trackTitle"></h2><button class="btn ghost" id="pins"></button></div>
      <div class="body" id="body"></div>
      <div class="cmd">
        <div class="ac" id="ac"></div>
        <div class="preview" id="preview" hidden></div>
        <div class="listening" id="listening" hidden><span class="dots"><i></i><i></i><i></i></span><span id="listenTxt"></span></div>
        <form class="fieldrow" id="form" autocomplete="off">
          <label class="field"><span id="spark" aria-hidden="true"></span><span class="sr" id="fieldLabel"></span><input id="q" enterkeyhint="done" autocapitalize="off" spellcheck="false" aria-describedby="preview"><button type="button" class="iconbtn mic" id="mic"></button></label>
          <button class="send" id="send" disabled></button>
        </form>
      </div>
    </section>
  </div>
  <div class="modal" id="voice" hidden><div class="scrim"></div><div class="box" role="dialog" aria-modal="true" aria-labelledby="vTitle"><h3 id="vTitle"></h3><p id="vBody1"></p><p id="vBody2"></p><p id="vBody3"></p><div style="display:flex;gap:8px;margin-top:12px"><button class="btn tonal" id="vNo" style="flex:1"></button><button class="btn primary" id="vYes" style="flex:1"></button></div></div></div>
  <div class="sr" id="live" aria-live="polite"></div>
</div>
<aside class="notes" id="notes"></aside>
</div>

  const s=strip(q);const items=[];
  for(const e of recentCombos()){const label=`${nm(e.preset)} ${detailOf(e.preset,e.payload)}`;if(strip(label).includes(s)||strip(nm(e.preset)).startsWith(s))items.push({label,fill:e.fill,sub:t('ago',{d:fmtDur(Date.now()-e.start)}),icon:P[e.preset][1]});}
  for(const k of Object.keys(P)){if(strip(nm(k)).startsWith(s)&&!items.some(i=>strip(i.label).startsWith(strip(nm(k)))))items.push({label:nm(k),fill:nm(k).toLowerCase()+' ',sub:'',icon:P[k][1]});}
  ac.innerHTML=items.slice(0,3).map(i=>`<button type="button" data-fill="${i.fill}">${ic(i.icon,18)}${i.label}<small>${i.sub}</small></button>`).join('');
}
$('#ac').addEventListener('click',ev=>{const b=ev.target.closest('[data-fill]');if(!b)return;$('#q').value=b.dataset.fill;renderPreview();$('#q').focus();});
function recentCombos(){
  const seen=new Set();const out=[];
  for(const e of [...S.events].filter(e=>e.baby===S.baby&&e.end!==null).sort((a,b)=>b.start-a.start)){
    const sig=e.preset+JSON.stringify(e.payload);if(seen.has(sig))continue;seen.add(sig);
    out.push({...e,fill:fillFor(e)});if(out.length>=3)break;}
  return out;
}
function fillFor(e){const pt=S.lang==='pt';const n=nm(e.preset).toLowerCase();
  if(e.preset==='bottle')return `${n} ${e.payload.amount} ${t(e.payload.content).toLowerCase()}`;
  if(e.preset==='diaper')return `${n} ${t(e.payload.content).toLowerCase()}`;
  if(e.preset==='medication')return e.payload.medications.map(m=>`${MEDS.find(x=>x.id===m.id).name.toLowerCase()}`).join(pt?' e ':' and ');
  return n;}

/* ---------- committing ---------- */
let toastT=null,undoIds=null,undoStopped=null;
function commit(p){
  if(!p||!p.type||p.needs.length)return;
  const ids=[];undoStopped=[];
  for(const b of p.babies){
    if(p.stopsSleep){for(const e of S.events.filter(e=>e.baby===b&&e.end===null&&['nap','night'].includes(e.preset))){undoStopped.push(e.id);e.end=p.start;}}
    const ev={id:uid(),baby:b,preset:p.type,start:p.start,end:p.running?null:p.end,payload:structuredClone(p.payload),notes:p.notes.concat(p.unknown).join(' ')||null};
    S.events.push(ev);ids.push(ev.id);}
  undoIds=ids;
  const det=detailOf(p.type,p.payload);const what=`${nm(p.type)}${det?' · '+det:''}`;
  $('#toast').innerHTML=`${circ(P[p.type][0],P[p.type][1],'s',18)}<div class="tx"><b>${what}</b><span>${p.running?t('startsTimer',{when:whenText(p)}):t('logs',{when:whenText(p)})}${S.twins?' · '+p.babies.map(b=>BABIES[b]).join(' + '):''}</span></div><button class="btn tonal" id="undo">${ic('undo',18)}${t('undo')}</button>`;
  $('#toast').classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>$('#toast').classList.remove('show'),6000);
  $('#live').textContent=what;
  if(navigator.vibrate)try{navigator.vibrate(10)}catch(e){}
  $('#q').value='';renderPreview();closeSheet();renderMain(ids);
}
$('#toast').addEventListener('click',ev=>{if(!ev.target.closest('#undo'))return;S.events=S.events.filter(e=>!undoIds.includes(e.id));for(const id of undoStopped){const e=S.events.find(x=>x.id===id);if(e)e.end=null;}$('#toast').classList.remove('show');$('#live').textContent=t('undone');renderMain();});
$('#toast').addEventListener('pointerenter',()=>clearTimeout(toastT));
$('#toast').addEventListener('pointerleave',()=>{toastT=setTimeout(()=>$('#toast').classList.remove('show'),3000);});
$('#form').addEventListener('submit',ev=>{ev.preventDefault();commit(current);});
$('#q').addEventListener('input',renderPreview);

/* ---------- sheet body: suggestions, repeat, all presets ---------- */
function renderBody(){
  const lb=lastOf('bottle');
  const sugs=[
    {k:'nap',sub:t('awakeFor'),fill:null},
    {k:'bottle',sub:t('lastFeed'),fill:lb?fillFor(lb):null,label:lb?`${nm('bottle')} ${lb.payload.amount} ml`:nm('bottle')},
    {k:'diaper',sub:t('lastDiaper'),fill:nm('diaper').toLowerCase()+' '}
  ];
  $('#body').innerHTML=`<div class="flabel">${ic('spark',14)}${t('suggested')}</div><div class="sugs">${sugs.map(s=>`<button class="sug" data-sug="${s.k}" data-fill="${s.fill||''}">${circ(P[s.k][0],P[s.k][1],'s',18)}<b>${s.label||nm(s.k)}</b><span>${s.sub}</span></button>`).join('')}</div>
  <div class="flabel">${ic('repeat',14)}${t('repeat')}</div>${recentCombos().map(e=>`<button class="rep" data-repeat="${e.id}">${circ(P[e.preset][0],P[e.preset][1],'s',18)}<span class="tx"><b>${nm(e.preset)}${detailOf(e.preset,e.payload)?' · '+detailOf(e.preset,e.payload):''}</b><span>${t('ago',{d:fmtDur(Date.now()-e.start)})}</span></span><span class="go">${ic('repeat',16)}${t('again')}</span></button>`).join('')}
  <div class="flabel">${t('all')}</div><div class="grid">${['wake_up','nap','bedtime','fell_asleep','night_waking','bottle','nursing','diaper','medication','belly_pain','bath','tummy_time'].map(k=>`<button class="tile" data-tile="${k}">${circ(P[k][0],P[k][1],'s',18)}${nm(k)}</button>`).join('')}</div>`;
}
$('#body').addEventListener('click',ev=>{
  const b=ev.target.closest('button');if(!b)return;
  if(b.dataset.sug){if(b.dataset.sug==='nap'){commit(parse(nm('nap')));return;}if(b.dataset.sug==='bottle'&&b.dataset.fill){commit(parse(b.dataset.fill));return;}$('#q').value=b.dataset.fill||nm(b.dataset.sug).toLowerCase()+' ';renderPreview();$('#q').focus();return;}
  if(b.dataset.repeat){const e=S.events.find(x=>x.id===b.dataset.repeat);const timer=P[e.preset][2]==='timer';const n=Date.now();const pl=structuredClone(e.payload);if(e.preset==='nursing'){delete pl.left;delete pl.right;pl.side='left';}
    commit({type:e.preset,payload:pl,needs:[],notes:[],unknown:[],babies:[S.baby],start:n,end:timer?null:n,running:timer});return;}
  if(b.dataset.tile){const k=b.dataset.tile;$('#q').value=nm(k).toLowerCase()+' ';renderPreview();$('#q').focus();}
});

/* ---------- voice (simulated; see the privacy copy) ---------- */
const SAMPLES={en:['bottle 120 breast milk 10 min ago','wet diaper','nap 15 min ago','colidis 5 drops','woke up 5 min ago','nursing left 8 right 6'],pt:['mamadeira 120 leite materno há 10 min','fralda xixi','soneca há 15 min','colidis 5 gotas','acordou há 5 min','mamou esquerdo 8 direito 6']};
let listening=false;
$('#mic').addEventListener('click',()=>{if(!S.voiceOk){openVoice();return;}listen();});
function openVoice(){const v=$('#voice');v.hidden=false;['vTitle','vBody1','vBody2','vBody3','vNo','vYes'].forEach(id=>$('#'+id).textContent=t(id));$('#vYes').focus();}
$('#vNo').addEventListener('click',()=>{$('#voice').hidden=true;$('#q').focus();});
$('#vYes').addEventListener('click',()=>{S.voiceOk=true;$('#voice').hidden=true;listen();});
function listen(){
  if(listening)return;listening=true;$('#mic').classList.add('on');$('#listening').hidden=false;$('#listenTxt').textContent=t('listening');
  const phrase=SAMPLES[S.lang][Math.floor(Math.random()*SAMPLES[S.lang].length)];let i=0;$('#q').value='';
  const iv=setInterval(()=>{const words=phrase.split(' ');$('#q').value=words.slice(0,++i).join(' ');renderPreview();if(i>=words.length){clearInterval(iv);listening=false;$('#mic').classList.remove('on');$('#listening').hidden=true;$('#q').focus();}},280);
}

/* ---------- home background ---------- */
function renderMain(fresh=[]){
  const evs=[...S.events].filter(e=>S.twins||e.baby===S.baby).sort((a,b)=>b.start-a.start).slice(0,8);
  $('#main').innerHTML=`<div class="card"><div class="big tnum">${t('awake')}</div><div class="muted">${t('nextNap',{t:fmtT(Date.now()+20*MIN)})}</div></div>
  <div class="sect">${ic('clock',18)}${t('latest')}</div>${evs.map(e=>`<div class="rowi${fresh.includes(e.id)?' fresh':''}"><span class="time tnum">${fmtT(e.start)}</span>${circ(P[e.preset][0],P[e.preset][1],'s',18)}<div><div class="t1">${nm(e.preset)}${S.twins?` · ${BABIES[e.baby]}`:''}</div><div class="t2">${e.end===null?(S.lang==='pt'?'Em andamento':'Running'):[detailOf(e.preset,e.payload),e.end!==e.start?fmtDur(e.end-e.start):''].filter(Boolean).join(' · ')}</div></div></div>`).join('')}`;
  $('#nav').innerHTML=`<span>${ic('home')}${t('home')}</span><span>${ic('list')}${t('timeline')}</span><span style="position:relative"><button class="fab" id="fab" aria-label="${t('track')}">${ic('plus',28,2.2)}</button></span><span>${ic('chart')}${t('growth')}</span><span>${ic('gear')}${t('settings')}</span>`;
  $('#fab').onclick=openSheet;
}
// The field is one tap away at the bottom; it is not auto-focused, so the keyboard never hides the suggestions.
function openSheet(){$('#overlay').hidden=false;renderBody();setTimeout(()=>{const f=$('#body .sug');f&&f.focus({preventScroll:true});},50);}
function closeSheet(){$('#overlay').hidden=true;}
$('#scrim').addEventListener('click',closeSheet);
$('#close').addEventListener('click',closeSheet);
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(!$('#voice').hidden)$('#voice').hidden=true;else closeSheet();}});

function renderChrome(){
  document.documentElement.lang=S.lang==='pt'?'pt-BR':'en';
  $('#age').textContent=t('age');$('#trackTitle').textContent=t('track');$('#pins').textContent=t('pins');
  $('#close').innerHTML=ic('x');$('#spark').innerHTML=ic('spark',20);$('#mic').innerHTML=ic('mic');$('#mic').setAttribute('aria-label',S.lang==='pt'?'Falar':'Speak');
  $('#send').innerHTML=ic('send',24,2.2);$('#send').setAttribute('aria-label',t('log'));
  $('#q').placeholder=t('placeholder');$('#fieldLabel').textContent=t('fieldLabel');$('#q').setAttribute('aria-label',t('fieldLabel'));
  renderBody();renderPreview();renderMain();renderNotes();
}
function seed(){const n=Date.now(),a=m=>n-m*MIN;
  S.events=[
   {id:uid(),baby:'alice',preset:'medication',start:a(400),end:a(400),payload:{medications:[{id:'m1',dose:5,unit:'drops'},{id:'m2',dose:1,unit:'ml'}]}},
   {id:uid(),baby:'alice',preset:'nursing',start:a(318),end:a(300),payload:{left:480,right:360,side:'both'}},
   {id:uid(),baby:'alice',preset:'bottle',start:a(190),end:a(190),payload:{amount:90,content:'formula'}},
   {id:uid(),baby:'alice',preset:'nap',start:a(165),end:a(85),payload:{kind:'nap'}},
   {id:uid(),baby:'alice',preset:'diaper',start:a(70),end:a(70),payload:{content:'wet'}},
   {id:uid(),baby:'bia',preset:'bottle',start:a(150),end:a(150),payload:{amount:120,content:'formula'}}];}
function renderNotes(){
  const en=S.lang==='en';const ex=SAMPLES[S.lang].concat(en?['poop','sleep','bath at 18:30','belly pain 3','nap 13:10-14:05','meds','bottle 4 oz','bottle 90 "spat up a bit"','bia bottle 90','sleep for 40 min yesterday 14:00']:['cocô','dormiu','banho às 18h30','cólica 3','soneca das 13h10 às 14h05','remédios','mamadeira 90 "golfou um pouco"','bia mamadeira 90','xixi e cocô','dormiu por 40 min ontem 14:00']);
  $('#notes').innerHTML=`<h1>03-B Command bar</h1><p>${en?'The <b>+</b> sheet opens with the field focused. Typing builds a live preview from a local, deterministic parser (English and Portuguese are both understood regardless of the UI language). Nothing is logged until you press Log or Enter, and every log can be undone.':'A folha <b>+</b> abre com o campo em foco. Ao digitar, um analisador local e determinístico monta a prévia (entende inglês e português ao mesmo tempo). Nada é registrado antes de Registrar/Enter, e tudo pode ser desfeito.'}</p>
  <div class="ctl"><button aria-pressed="${S.lang==='en'}" data-lang="en">EN</button><button aria-pressed="${S.lang==='pt'}" data-lang="pt">PT-BR</button><button aria-pressed="${S.twins}" data-twins>Twins</button><button data-open>${en?'Open + sheet':'Abrir folha +'}</button></div>
  <h2>${en?'Tap an example to type it':'Toque num exemplo para digitar'}</h2><div class="ex">${ex.map(x=>`<button data-ex="${x.replace(/"/g,'&quot;')}">${x}</button>`).join('')}</div>
  <h2>${en?'Rules shown here':'Regras mostradas'}</h2><ul>
  <li>${en?'Missing required values never get silent defaults: the preview asks with chips (diaper content, intensity, which medication).':'Valores obrigatórios nunca ganham padrão silencioso: a prévia pergunta com chips.'}</li>
  <li>${en?'Optional values come from the last log (bottle content, amount) and are labelled “last”.':'Valores opcionais vêm do último registro e aparecem como “última”.'}</li>
  <li>${en?'“10 min ago” moves the start; “for 40 min” or a bare “40 min” on a timer type makes a finished session; a range sets both ends; “sleep” infers nap or night from the hour and offers a toggle.':'“há 10 min” move o início; “por 40 min” cria sessão encerrada; intervalos definem início e fim; “dormiu” infere soneca ou noite.'}</li>
  <li>${en?'Unknown words are shown as dashed chips and saved as a note unless removed.':'Palavras desconhecidas aparecem tracejadas e viram observação, a menos que removidas.'}</li>
  <li>${en?'Voice is simulated here. The real one is opt-in with the privacy notice shown on first use.':'A voz é simulada aqui; a real exige consentimento com o aviso de privacidade.'}</li></ul>`;
}
$('#notes').addEventListener('click',ev=>{const b=ev.target.closest('button');if(!b)return;
  if(b.dataset.lang){S.lang=b.dataset.lang;renderChrome();return;}
  if(b.hasAttribute('data-twins')){S.twins=!S.twins;renderChrome();return;}
  if(b.hasAttribute('data-open')){openSheet();return;}
  if(b.dataset.ex!=null){openSheet();$('#q').value=b.dataset.ex;renderPreview();}
});
seed();renderChrome();openSheet();
</script>
</body>
