# Rendered by the nginx image (envsubst) from /etc/nginx/templates. Only three variables are substituted
# (NGINX_ENVSUBST_FILTER in the Dockerfile): OIDC_ORIGIN (CSP), API_UPSTREAM (host:port of the API, default api:8080)
# and NGINX_LOCAL_RESOLVERS (nameservers of /etc/resolv.conf, set by the entrypoint).

# Cache-Control per request path. An empty value makes add_header skip the header.
# Evaluated lazily, so after try_files falls back to /index.html it sees /index.html.
# Regex maps are matched in order, first match wins.
map $uri $cache_control {
  default                                                                       "no-cache";
  ~^/api/                                                                       "";
  ~^/assets/                                                                    "public, max-age=31536000, immutable";
  ~^/(sw\.js|registerSW\.js|workbox-[^/]+\.js|manifest(-dark)?\.webmanifest|index\.html)$ "no-cache";
}

server {
  # nginx-unprivileged (uid 101) cannot bind ports below 1024.
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # The stock mime.types has no .webmanifest (served as application/octet-stream). A types block here
  # replaces the inherited http-level map, so the stock list is included again before the addition.
  include /etc/nginx/mime.types;
  types {
    application/manifest+json webmanifest;
  }

  server_tokens off;
  client_max_body_size 6m; # Napper CSV import

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json application/wasm;

  # Security headers. They live at server level only: any add_header inside a location would
  # drop all inherited ones. "always" also covers error responses.
  # CSP notes:
  #  - style-src 'unsafe-inline': MUI/emotion injects <style> tags at run time. Scripts stay strict
  #    ('self' only, no inline/eval), which is what protects the tokens held in localStorage.
  #  - script-src 'wasm-unsafe-eval': lets the cry monitor's worker compile its self-hosted WebAssembly
  #    (MediaPipe, /models/cry/wasm/). It allows WebAssembly compilation only: JavaScript eval() and inline
  #    scripts stay blocked. Workers and the audio worklet are same-origin ('self' via default-src / script-src).
  #  - Permissions-Policy microphone=(self): the cry monitor (foreground, opt-in) may ask this origin's page for
  #    the microphone; no other origin or frame can. Audio is analysed on the device and never leaves it
  #    (docs/design/35-cry-engine.md).
  #  - connect-src: same origin (/api/) plus the OIDC authority (discovery, token, userinfo, refresh).
  #  - The authorize/logout redirects are top-level navigations and are not restricted by CSP.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' ${OIDC_ORIGIN}; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
  add_header X-Content-Type-Options "nosniff" always;
  # no-referrer is enough: the authorization code flow carries everything in query/state, no provider needs a Referer.
  add_header Referrer-Policy "no-referrer" always;
  add_header Permissions-Policy "camera=(), microphone=(self), geolocation=(), payment=(), usb=()" always;
  # HSTS is intentionally not set here (the container speaks plain HTTP). Enable it on the TLS-terminating
  # proxy, or uncomment once this server is only reachable over HTTPS:
  # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header Cache-Control $cache_control;

  # The API host is resolved per request (variable proxy_pass + resolver), not at start-up: nginx starts even where no
  # API host exists (a missing one gives 502 on /api/ only). In Kubernetes the ingress sends /api to the API directly,
  # so nginx never sees it there. The resolver does not use resolv.conf search domains: API_UPSTREAM must be a name the
  # DNS server answers as is (a compose service name, or a cluster FQDN such as lotties-api.<ns>.svc.cluster.local:8080).
  resolver ${NGINX_LOCAL_RESOLVERS} valid=30s ipv6=off;

  location /api/ {
    set $api_upstream "${API_UPSTREAM}";
    # No URI part: the original request URI (/api/...) is passed unchanged.
    proxy_pass http://$api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_connect_timeout 5s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
  }

  # The cry monitor's model and WASM (docs/design/35-cry-engine.md): a missing file is a 404, never the app shell,
  # so the page reports model_missing instead of trying to load index.html as a model.
  location /models/ {
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
