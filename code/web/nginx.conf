# Rendered by the nginx image (envsubst) from /etc/nginx/templates; ${OIDC_ORIGIN} is the only variable substituted.

# Cache-Control per request path. An empty value makes add_header skip the header.
# Evaluated lazily, so after try_files falls back to /index.html it sees /index.html.
# Regex maps are matched in order, first match wins.
map $uri $cache_control {
  default                                                                       "no-cache";
  ~^/api/                                                                       "";
  ~^/assets/                                                                    "public, max-age=31536000, immutable";
  ~^/(sw\.js|registerSW\.js|workbox-[^/]+\.js|manifest(-dark)?\.webmanifest|index\.html)$ "no-cache";
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  server_tokens off;
  client_max_body_size 6m; # Napper CSV import

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;

  # Security headers. They live at server level only: any add_header inside a location would
  # drop all inherited ones. "always" also covers error responses.
  # CSP notes:
  #  - style-src 'unsafe-inline': MUI/emotion injects <style> tags at run time. Scripts stay strict
  #    ('self' only, no inline/eval), which is what protects the tokens held in localStorage.
  #  - connect-src: same origin (/api/) plus the OIDC authority (discovery, token, userinfo, refresh).
  #  - The authorize/logout redirects are top-level navigations and are not restricted by CSP.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' ${OIDC_ORIGIN}; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
  add_header X-Content-Type-Options "nosniff" always;
  # no-referrer is enough: the authorization code flow carries everything in query/state, no provider needs a Referer.
  add_header Referrer-Policy "no-referrer" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
  # HSTS is intentionally not set here (the container speaks plain HTTP). Enable it on the TLS-terminating
  # proxy, or uncomment once this server is only reachable over HTTPS:
  # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header Cache-Control $cache_control;

  location /api/ {
    proxy_pass http://api:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_connect_timeout 5s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
