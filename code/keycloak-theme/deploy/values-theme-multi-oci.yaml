# RECOMMENDED layout for a SHARED Keycloak: ONE emptyDir mounted over the whole /opt/bitnami/keycloak/themes
# directory, filled by an init container from an image that holds N theme folders (/themes/<name>/login/...).
# Other apps' themes are added by putting another folder in the image (see docs/DEPLOY.md, "Adding another theme").
#   helm upgrade keycloak oci://registry-1.docker.io/bitnamicharts/keycloak --version 24.0.5 \
#     -n keycloak --reuse-values -f values-theme-multi-oci.yaml
# Do not combine with values-theme-oci.yaml / values-theme-url.yaml (same list keys: Helm replaces lists).
# Mounting over themes/ hides nothing Keycloak needs: the built-in themes (base, keycloak, ...) are inside the
# server jar; the image's themes/ directory only holds README.md (verified on 26.0.5-debian-12-r0).
initContainers:
  - name: br-themes-init
    # CHANGE: ghcr.io/<owner>/lotties-keycloak-themes:<version> or your own registry. Bump the tag per change.
    image: ghcr.io/lotties-app/lotties-keycloak-themes:0.1.0
    imagePullPolicy: IfNotPresent
    command: ["sh", "-c", "cp -R /themes/. /target/ && echo themes copied"]
    securityContext:
      runAsNonRoot: true
      runAsUser: 1001
      runAsGroup: 1001
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop: ["ALL"]
      seccompProfile:
        type: RuntimeDefault
    resources:
      requests:
        cpu: 10m
        memory: 16Mi
      limits:
        cpu: 100m
        memory: 64Mi
    volumeMounts:
      - name: br-themes
        mountPath: /target

extraVolumes:
  - name: br-themes
    emptyDir:
      sizeLimit: 64Mi

extraVolumeMounts:
  - name: br-themes
    mountPath: /opt/bitnami/keycloak/themes
    readOnly: true
