// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    // Kotlin for the app's own native code (app/src/main/java/app/lotties/app/shared, widgets); compatible with
    // AGP 8.13 and Gradle 8.14. A Compose/Glance widget adds the compose compiler plugin with this same version.
    ext.kotlinVersion = '2.2.20'
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
        classpath 'com.google.gms:google-services:4.4.4'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlinVersion"
        // Compose compiler for the Jetpack Glance home-screen widgets (app/src/main/java/app/lotties/app/widgets).
        classpath "org.jetbrains.kotlin:compose-compiler-gradle-plugin:$kotlinVersion"

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
